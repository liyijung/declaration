<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <link rel="icon" href="favicon_A.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <title>進階條件示範影片</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        video {
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <video id="tutorialVideo" src="dataSplitter.mp4" controls autoplay></video>

    <script>
        const video = document.getElementById('tutorialVideo');

        // 使用者互動後才允許進入全螢幕
        video.addEventListener('play', () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) { // Safari
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) { // IE
                video.msRequestFullscreen();
            }
        }, { once: true }); // 確保只觸發一次
    </script>
</body>
</html>
