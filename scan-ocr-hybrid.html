<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>混合式即時掃描：條碼優先＋OCR</title>
	<style>
		:root {
			--ok: #11a36d;
			--bad: #e23b3b;
			--muted: #888;
			--brand: #3066e5;
		}

		* {
			box-sizing: border-box
		}

		body {
			font-family: "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
			margin: 0;
			background: #f7f9fb;
			color: #222
		}

		header {
			padding: 14px 16px;
			background: #fff;
			position: sticky;
			top: 0;
			box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
			z-index: 5
		}

		h1 {
			margin: 0;
			font-size: 18px
		}

		main {
			padding: 14px
		}

		.panel {
			background: #fff;
			border: 1px solid #eee;
			border-radius: 12px;
			padding: 12px;
			margin-bottom: 12px
		}

		.row {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			align-items: center
		}

		.btn {
			appearance: none;
			border: 0;
			padding: 10px 14px;
			border-radius: 10px;
			background: var(--brand);
			color: #fff;
			font-weight: 600;
			font-size: 14px
		}

		.btn.secondary {
			background: #e3e8ff;
			color: #2a3a8c
		}

		.btn.danger {
			background: #e23b3b
		}

		select,
		input[type="text"],
		input[type="url"],
		input[type="number"] {
			padding: 8px 10px;
			border: 1px solid #ddd;
			border-radius: 10px;
			font-size: 14px;
			background: #fff
		}

		input[type="file"] {
			font-size: 14px
		}

		.hint {
			color: #666;
			font-size: 12px
		}

		/* 視訊區：固定比例，影片鋪滿 */
		#videoWrap {
			position: relative;
			border-radius: 14px;
			overflow: hidden;
			background: #000;
			aspect-ratio: 16/9;
			width: 100%
		}

		#video {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover
		}

		#overlayMsg {
			position: absolute;
			left: 8px;
			bottom: 8px;
			padding: 8px 10px;
			border-radius: 10px;
			background: linear-gradient(0deg, #777, #999);
			color: #fff;
			font-weight: 700
		}

		.stat {
			background: #fff;
			border: 1px solid #eee;
			border-radius: 10px;
			padding: 8px 10px;
			font-size: 12px
		}

		table {
			width: 100%;
			border-collapse: collapse;
			table-layout: fixed
		}

		th,
		td {
			padding: 8px;
			border-bottom: 1px dashed #eee;
			font-family: ui-monospace, Menlo, Consolas, monospace;
			text-align: left;
		}

		/* 固定欄寬避免對不齊 */
		th:nth-child(1),
		td:nth-child(1) {
			width: 50%
		}

		th:nth-child(2),
		td:nth-child(2) {
			width: 25%
		}

		th:nth-child(3),
		td:nth-child(3) {
			width: 25%
		}

		.ok {
			color: var(--ok);
			font-weight: 700
		}

		.bad {
			color: var(--bad);
			font-weight: 700
		}

		.pill {
			display: inline-block;
			padding: 2px 8px;
			border-radius: 999px;
			background: #eef2ff;
			color: #334
		}

		label.inline {
			display: flex;
			align-items: center;
			gap: 6px
		}

		/* ROI 方框 */
		#roi {
			position: absolute;
			border: 2px solid rgba(255, 255, 255, .95);
			border-radius: 8px;
			box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .25);
			touch-action: none
		}

		#roi .handle {
			position: absolute;
			width: 16px;
			height: 16px;
			background: #fff;
			border: 2px solid #333;
			border-radius: 50%
		}

		#roi .handle.nw {
			left: -10px;
			top: -10px
		}

		#roi .handle.ne {
			right: -10px;
			top: -10px
		}

		#roi .handle.sw {
			left: -10px;
			bottom: -10px
		}

		#roi .handle.se {
			right: -10px;
			bottom: -10px
		}
	</style>
</head>

<body>
	<header>
		<h1>混合式即時掃描：條碼優先＋OCR（免按拍照）</h1>
	</header>
	<main>

		<!-- 清單 -->
		<section class="panel">
			<div class="row" style="justify-content:space-between">
				<div class="pill">步驟 1. 載入清單</div>
				<div class="row">
					<button class="btn" id="btnUseColumn" disabled>載入此欄為清單</button>
					<button class="btn secondary" id="btnClearCache">清除快取</button>
				</div>
			</div>

			<div class="row" style="margin-top:6px">
				<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
				<label>工作表
					<select id="sheetSelect" disabled></select>
				</label>
				<label>欄位
					<select id="colSelect" disabled></select>
				</label>
			</div>

			<div class="row" style="margin-top:6px">
				<label class="inline"><input type="checkbox" id="ignoreJoiners" checked> 忽略空白與連字號</label>
				<label>字元白名單（Tesseract）
					<input type="text" id="whitelistChars" value="SF0123456789" size="18" />
				</label>
				<label>格式白名單（正則，逗號或 | 分隔）
					<!-- 這裡改為單斜線 \d，避免筆數=0 -->
					<input type="text" id="formatPatterns" value="SF\d{13}" size="22" />
				</label>
				<span class="hint">字元白名單限制 OCR 字元；格式白名單再用正則過濾（預設：SF+13碼或12碼數字）。</span>
			</div>

			<div class="row" style="margin-top:6px">
				<div class="stat">清單筆數：<b id="countList">0</b></div>
				<div class="stat">來源：<b id="listSource">—</b></div>
				<div class="stat">更新時間：<b id="listTime">—</b></div>
			</div>
		</section>

		<!-- 相機 + 連續辨識 -->
		<section class="panel">
			<div class="row" style="justify-content:space-between">
				<div class="pill">步驟 2. 即時掃描</div>
				<div class="row">
					<div class="stat">擷取碼數：<b id="countExtracted">0</b></div>
					<div class="stat">命中：<b id="countHit">0</b></div>
					<div class="stat">未命中：<b id="countMiss">0</b></div>
				</div>
			</div>

			<div id="videoWrap" style="margin-top:6px">
				<video id="video" playsinline></video>
				<canvas id="canvas" style="display:none"></canvas>
				<div id="roi" hidden>
					<div class="handle nw"></div>
					<div class="handle ne"></div>
					<div class="handle sw"></div>
					<div class="handle se"></div>
				</div>
				<div id="overlayMsg">尚未開始</div>
			</div>

			<div class="row" style="margin-top:10px">
				<button class="btn" id="btnStart">開啟相機＋即時掃描</button>
				<button class="btn danger" id="btnStop" disabled>停止</button>
				<label class="inline"><input type="checkbox" id="barcodeOnly"> 只辨識條碼</label>
				<label class="inline">OCR 間隔(ms)
					<input type="number" id="intervalMs" value="1200" style="width:100px" />
					<span id="intervalSec" class="hint">(約 1.2 秒)</span>
				</label>
			</div>

			<div class="hint" style="margin-top:8px">
				條碼（Code128/QR 等）會優先嘗試；若持續抓不到條碼，會自動改跑 OCR。
			</div>
		</section>

		<!-- 結果 -->
		<section class="panel">
			<div class="row" style="justify-content:space-between">
				<div class="pill">擷取結果</div>
				<div class="row">
					<button class="btn secondary" id="btnClearResult">清除結果</button>
					<button class="btn secondary" id="btnExportCSV">匯出結果 CSV</button>
				</div>
			</div>
			<div class="hint" id="ocrTime">單次 OCR 用時：—</div>
			<table id="resultTable">
				<thead>
					<tr>
						<th>代碼</th>
						<th>來源</th>
						<th>比對</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</section>

	</main>

	<!-- ZXing（條碼） -->
	<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
	<!-- Tesseract.js（OCR） -->
	<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

	<script>
		/* ---- 多重 CDN 載入工具（for XLSX） ---- */
		async function loadScriptSeq(urls) {
			for (const url of urls) {
				try {
					await new Promise((resolve, reject) => {
						const s = document.createElement('script');
						s.src = url; s.async = true; s.crossOrigin = 'anonymous';
						s.onload = resolve; s.onerror = () => reject(new Error('load fail: ' + url));
						document.head.appendChild(s);
					});
					return;
				} catch (e) { console.warn('[XLSX] 失敗，下一個：', e.message); }
			}
			throw new Error('所有 CDN 都載入失敗');
		}
		async function ensureXLSX() {
			if (window.XLSX) return;
			const urls = [
				'https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js',
				'https://fastly.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js',
				'https://gcore.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js',
				'https://unpkg.com/xlsx@0.20.3/dist/xlsx.full.min.js',
				'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
			];
			await loadScriptSeq(urls);
			if (!window.XLSX) throw new Error('XLSX still undefined after load');
		}

		(function () {
			// ===== 狀態 =====
			let listSet = new Set();
			let workbook = null, sheetNames = [], activeSheet = null, headerRow = [];
			let videoStream = null, currentDeviceId = null, devices = [];
			let codeReader = null;       // ZXing
			let worker = null;           // Tesseract worker
			let loopTimer = null, isBusy = false;
			let lastBarcodeTs = 0, ocrCooldownMs = 900, missBarcodeTimes = 0, barcodeFirstTries = 2;
			let extractedSet = new Set(); let hitCount = 0, missCount = 0;
			let scanning = false;

			// ROI（相對 #videoWrap 的百分比座標）
			let roi = { x: 0.05, y: 0.10, w: 0.9, h: 0.6 }; // 預設框
			let dragging = null; // 'move' 或 'nw' | 'ne' | 'sw' | 'se'

			const LS_KEY_CAMERA = 'preferred_camera_id';
			currentDeviceId = localStorage.getItem(LS_KEY_CAMERA) || null;

			// ===== DOM =====
			const fileInput = document.getElementById('fileInput');
			const sheetSelect = document.getElementById('sheetSelect');
			const colSelect = document.getElementById('colSelect');
			const btnUseColumn = document.getElementById('btnUseColumn');

			const ignoreJoiners = document.getElementById('ignoreJoiners');
			const whitelistChars = document.getElementById('whitelistChars');
			const formatInput = document.getElementById('formatPatterns');

			const countList = document.getElementById('countList');
			const listSource = document.getElementById('listSource');
			const listTime = document.getElementById('listTime');

			const video = document.getElementById('video');
			const canvas = document.getElementById('canvas');
			const overlayMsg = document.getElementById('overlayMsg');

			const btnStart = document.getElementById('btnStart');
			const btnStop = document.getElementById('btnStop');
			const intervalMs = document.getElementById('intervalMs');
			const intervalSec = document.getElementById('intervalSec');

			const videoWrap = document.getElementById('videoWrap');
			const roiBox = document.getElementById('roi');
			const barcodeOnly = document.getElementById('barcodeOnly');

			function updateROIBox() {
				// 只在掃描中顯示 ROI
				roiBox.hidden = !scanning;
				if (!scanning) return;

				const rect = videoWrap.getBoundingClientRect();
				const x = rect.width * roi.x, y = rect.height * roi.y;
				const w = rect.width * roi.w, h = rect.height * roi.h;
				roiBox.style.left = x + 'px';
				roiBox.style.top = y + 'px';
				roiBox.style.width = w + 'px';
				roiBox.style.height = h + 'px';
			}
			window.addEventListener('resize', updateROIBox);

			function updateIntervalHint() {
				const ms = Number(intervalMs.value) || 0;
				intervalSec.textContent = `(約 ${(ms / 1000).toFixed(2)} 秒)`;
			}
			updateIntervalHint();
			intervalMs.addEventListener('input', updateIntervalHint);

			const countExtracted = document.getElementById('countExtracted');
			const countHit = document.getElementById('countHit');
			const countMiss = document.getElementById('countMiss');
			const resultBody = document.querySelector('#resultTable tbody');
			const ocrTime = document.getElementById('ocrTime');

			const btnClearCache = document.getElementById('btnClearCache');
			const btnClearResult = document.getElementById('btnClearResult');
			const btnExportCSV = document.getElementById('btnExportCSV');

			// ===== 格式白名單：編譯與判斷（自動把 \\d 轉成 \d 以防輸入錯誤） =====
			let formatRegexes = [];
			function compileFormats(str) {
				const raw = String(str || '').trim();
				if (!raw) return [];
				const parts = raw.split(/[,|]/).map(s => s.trim()).filter(Boolean);
				const regs = [];
				for (let p of parts) {
					// 把 \\d, \\w 等轉為單斜線
					p = p.replace(/\\\\/g, '\\');
					const pat = (p.startsWith('^') ? p : '^' + p) + (p.endsWith('$') ? '' : '$');
					try { regs.push(new RegExp(pat)); }
					catch (e) { console.warn('格式白名單無效：', p, e.message); }
				}
				return regs;
			}
			function isAllowedFormat(code) {
				if (!formatRegexes.length) return true;
				return formatRegexes.some(re => re.test(code));
			}
			formatRegexes = compileFormats(formatInput.value);
			formatInput.addEventListener('input', () => { formatRegexes = compileFormats(formatInput.value); });

			// ===== Excel/CSV 上傳 =====
			fileInput.addEventListener('change', async (e) => {
				await ensureXLSX();
				resetExcelState();
				const f = e.target.files?.[0]; if (!f) return;
				listSource.textContent = f.name; listTime.textContent = new Date().toLocaleString();

				const buf = await f.arrayBuffer();
				workbook = XLSX.read(buf, { type: 'array', raw: true, codepage: 65001 });
				afterWorkbookLoaded();
			});

			function resetExcelState() {
				workbook = null; sheetNames = []; activeSheet = null; headerRow = [];
				sheetSelect.innerHTML = ''; colSelect.innerHTML = '';
				sheetSelect.disabled = true; colSelect.disabled = true; btnUseColumn.disabled = true;
				listSet = new Set(); countList.textContent = '0';
			}
			function afterWorkbookLoaded() {
				sheetNames = workbook.SheetNames || [];
				if (!sheetNames.length) { toast('讀不到工作表', 'bad'); return; }
				sheetSelect.disabled = false;
				sheetSelect.innerHTML = sheetNames.map((s, i) => `<option value="${i}">${escapeHtml(s)}</option>`).join('');
				setActiveSheetByIndex(0);
			}
			sheetSelect.addEventListener('change', e => setActiveSheetByIndex(Number(e.target.value || 0)));

			function setActiveSheetByIndex(idx) {
				activeSheet = workbook.Sheets[sheetNames[idx]];
				const rows = XLSX.utils.sheet_to_json(activeSheet, { header: 1, raw: true, defval: '' });

				let headers = (rows[0] || []).map(v => String(v).trim());
				if (!headers.length || headers.every(h => h === '')) {
					const maxCols = Math.max(0, ...rows.slice(0, 20).map(r => (r || []).length));
					headers = Array.from({ length: maxCols }, (_, i) => `欄${i + 1}`);
				}
				headerRow = headers; fillColSelect(headerRow);

				const guess = guessCodeColumnIndex(headerRow);
				colSelect.value = String(guess >= 0 ? guess : 0);

				sheetSelect.disabled = false; colSelect.disabled = false; btnUseColumn.disabled = false;
			}
			function fillColSelect(headers) {
				colSelect.innerHTML = headers.map((h, i) => `<option value="${i}">${escapeHtml(h || '(無標題)')}（第${i + 1}欄）</option>`).join('');
				if (!headers.length) { colSelect.innerHTML = `<option value="0">欄1（第1欄）</option>`; }
				colSelect.disabled = false; btnUseColumn.disabled = false;
			}
			function guessCodeColumnIndex(headers) {
				const keys = ['明單', '明細單', '清單', '號碼', '代碼', '條碼', '碼號', '編號', '單號', 'tracking', 'hawb', '主號', '分號', 'no', 'code', 'barcode'];
				const lowered = headers.map(h => String(h || '').toLowerCase());
				for (let i = 0; i < lowered.length; i++) { if (keys.some(k => lowered[i].includes(k))) return i; }
				return headers.length === 1 ? 0 : -1;
			}

			btnUseColumn.addEventListener('click', () => {
				if (!activeSheet) { toast('尚未選擇工作表', 'bad'); return; }
				const colIndex = Number(colSelect.value || 0);
				const rows = XLSX.utils.sheet_to_json(activeSheet, { header: 1, raw: true, defval: '' });
				const values = [];
				for (let r = 1; r < rows.length; r++) {
					const v = rows[r][colIndex];
					if (v === null || v === undefined) continue;
					const n = sanitizeOCR(String(v));
					if (isAllowedFormat(n)) values.push(n);
				}
				loadListValues(values, listSource.textContent || '上傳檔案');
				toast(`已載入清單，共 ${values.length} 筆`, 'ok');
			});

			function loadListValues(values, sourceLabel) {
				listSet = new Set(values);
				countList.textContent = String(listSet.size);
				listSource.textContent = sourceLabel;
				listTime.textContent = new Date().toLocaleString();
				try {
					localStorage.setItem('ocr_list_values', JSON.stringify(values));
					localStorage.setItem('ocr_list_meta', JSON.stringify({
						source: sourceLabel, time: listTime.textContent,
						ignoreJoiners: !!ignoreJoiners.checked,
						whitelist: whitelistChars.value || '',
						format: formatInput.value || ''
					}));
				} catch (_) { }
			}

			// 清除快取
			btnClearCache.addEventListener('click', () => {
				localStorage.removeItem('ocr_list_values');
				localStorage.removeItem('ocr_list_meta');
				toast('已清除快取', 'muted');
			});

			// ===== 相機 + 連續掃描 =====
			btnStart.addEventListener('click', startLive);
			btnStop.addEventListener('click', stopLive);

			async function startLive() {
				if (scanning) return;
				btnStart.disabled = true;

				try {
					codeReader = new ZXing.BrowserMultiFormatReader();

					if (!barcodeOnly.checked) {
						if (!worker) {
							worker = await Tesseract.createWorker('eng', 1);
							await worker.setParameters({
								tessedit_char_whitelist: whitelistChars.value || '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-'
							});
						}
					}

					devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
					const back = devices.find(d => /back|rear|environment/i.test(d.label));
					if (!currentDeviceId) { currentDeviceId = (back || devices[0])?.deviceId || undefined; }

					const constraints = {
						video: currentDeviceId ? { deviceId: { exact: currentDeviceId } } : { facingMode: 'environment' },
						audio: false
					};
					videoStream = await navigator.mediaDevices.getUserMedia(constraints);
					video.srcObject = videoStream; await video.play();

					// 記住鏡頭（雖然沒有切換按鈕，仍保留使用者偏好）
					if (currentDeviceId) localStorage.setItem(LS_KEY_CAMERA, currentDeviceId);

					scanning = true;
					btnStop.disabled = false;

					codeReader.decodeFromVideoDevice(currentDeviceId, video, (result, err) => {
						if (result && result.getText) {
							const raw = result.getText().toString();
							onCandidate(raw, 'BARCODE');
							lastBarcodeTs = Date.now(); missBarcodeTimes = 0;
						} else if (err) {
							if (Date.now() - lastBarcodeTs > 400) { missBarcodeTimes++; }
						}
					});

					toast('即時掃描中（條碼優先 → OCR）', 'muted');
					if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
					if (!barcodeOnly.checked) {
						const baseInterval = Math.max(600, Number(intervalMs.value) || 1200);
						loopTimer = setInterval(runOCRTick, baseInterval);
					}

					scanning = true;
					lastSmallGray = null;
					stableFrames = 0;

					updateROIBox(); // 顯示 ROI
				} catch (e) {
					toast('相機啟動失敗：' + (e?.message || e), 'bad');
					btnStart.disabled = false;
				}
			}

			async function stopLive() {
				if (!scanning) return;
				if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
				isBusy = false;
				try { await codeReader?.reset(); } catch (_) { }
				try { video.pause(); } catch (_) { }
				try { video.srcObject?.getTracks()?.forEach(t => t.stop()); } catch (_) { }
				video.srcObject = null; videoStream = null;
				btnStop.disabled = true; btnStart.disabled = false;
				toast('已停止', 'muted');
				scanning = false;
				// 不改變 currentDeviceId；下次仍用同一顆鏡頭

				scanning = false;
				lastSmallGray = null;
				stableFrames = 0;

				updateROIBox(); // 隱藏 ROI
			}

			barcodeOnly.addEventListener('change', () => {
				// 掃描中切換：控制 OCR 計時器開關
				if (!scanning) return;
				if (loopTimer) { clearInterval(loopTimer); loopTimer = null; }
				if (!barcodeOnly.checked) {
					const baseInterval = Math.max(600, Number(intervalMs.value) || 1200);
					loopTimer = setInterval(runOCRTick, baseInterval);
				} else {
					// 只辨識條碼時，確保不會跑 OCR
					// 也可提示一下
					toast('已切換為只辨識條碼', 'muted');
				}
			});

			// OCR 週期任務（條碼抓不到才跑）
			async function runOCRTick() {
				if (isBusy || !videoStream) return;
				const since = Date.now() - lastBarcodeTs;
				if (missBarcodeTimes < barcodeFirstTries && since < 600) return;
				if (since < ocrCooldownMs) return;

				isBusy = true;
				const t0 = performance.now();
				try {
					const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
					const r = pixelROI(vw, vh);
					const sx = r.x, sy = r.y, sw = r.w, sh = r.h;  // ← 使用 ROI
					const maxW = 800;
					const scale = sw > maxW ? maxW / sw : 1;
					const w = Math.round(sw * scale), h = Math.round(sh * scale);

					canvas.width = w; canvas.height = h;
					const ctx = canvas.getContext('2d');
					ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);

					// 加上防晃動檢查
					const shaky = detectMotion(ctx, w, h);
					if (shaky) {
						if (!wasShaky) toast('畫面晃動中，暫停 OCR', 'muted');
						wasShaky = true;
						isBusy = false;
						return;
					}
					wasShaky = false;
					if (stableFrames < MOTION.minStable) { isBusy = false; return; }

					const { data } = await worker.recognize(canvas);
					const rawText = (data.text || '').toUpperCase();

					const candidates = extractCandidates(rawText);
					let added = 0, anyHit = false;
					for (const cand of candidates) {
						if (extractedSet.has(cand)) continue;
						extractedSet.add(cand); added++;
						const inList = listSet.has(cand);
						if (inList) anyHit = true;
						updateResult(cand, inList, 'OCR');
					}

					const t1 = performance.now();
					ocrTime.textContent = '單次 OCR 用時：' + ((t1 - t0) / 1000).toFixed(2) + ' 秒';

					if (added === 0) {
						toast('辨識中…（條碼未得、OCR 未擷取到有效碼）', 'muted');
					} else {
						toast(anyHit ? '✔ 命中清單' : '✘ 未命中', anyHit ? 'ok' : 'bad');
						if (anyHit) { toast('✔ 命中清單', 'ok'); }
					}
				} catch (e) {
					toast('OCR 失敗：' + (e?.message || e), 'bad');
				} finally {
					isBusy = false;
				}
			}

			// 條碼/OCR 候選處理
			function onCandidate(text, source) {
				const cand = sanitizeOCR(text);
				if (!isAllowedFormat(cand)) return;
				if (extractedSet.has(cand)) return;
				extractedSet.add(cand);
				const inList = listSet.has(cand);
				updateResult(cand, inList, source);
				toast(inList ? '✔ 命中清單' : '✘ 未命中', inList ? 'ok' : 'bad');
			}

			// 候選抽取與正規化
			function extractCandidates(ocrText) {
				const collapsed = ocrText.replace(/[\s\-–—_]/g, '');
				const out = new Set();

				(collapsed.match(/[A-Z0-9\-]{6,}/g) || []).forEach(s => {
					const fixed = sanitizeOCR(s);
					if (isAllowedFormat(fixed)) out.add(fixed);
				});

				const tokens = ocrText.split(/[^A-Z0-9\-]+/i).filter(Boolean);
				for (const tk of tokens) {
					const fixed = sanitizeOCR(tk);
					if (isAllowedFormat(fixed)) out.add(fixed);
				}
				return Array.from(out);
			}

			function toHalfWidth(str) {
				return str.replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
			}
			function sanitizeOCR(raw) {
				let s = toHalfWidth((raw || '')).toUpperCase();
				if (ignoreJoiners.checked) { s = s.replace(/[\s\-–—_]/g, ''); }
				const fixDigits = t => {
					// 若整串含 O 與 9 混雜，則不強制轉 O → 0
					if (t.includes('9') && t.includes('O')) return t;
					return t
						.replace(/[〇]/g, '0')
						.replace(/[I|l]/g, '1')
						.replace(/B/g, '8')
						.replace(/S/g, '5')
						.replace(/Z/g, '2')
						.replace(/O/g, '0'); // 最後才轉 O→0，降低誤轉風險
				};
				if (s.startsWith('SF')) s = 'SF' + fixDigits(s.slice(2)); else s = fixDigits(s);
				const allow = new RegExp('[^' + escapeForClass(whitelistChars.value || '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-') + ']', 'g');
				s = s.replace(allow, '');
				return s;
			}
			function escapeForClass(chars) { return chars.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'); }

			// 結果顯示/統計
			function updateResult(code, inList, source) {
				const tr = document.createElement('tr');
				const td1 = document.createElement('td'); td1.textContent = code;
				const tdS = document.createElement('td'); tdS.textContent = source || '—';
				const td2 = document.createElement('td'); td2.textContent = inList ? '在清單' : '不在清單';
				td2.className = inList ? 'ok' : 'bad';
				tr.appendChild(td1); tr.appendChild(tdS); tr.appendChild(td2);
				resultBody.prepend(tr);

				if (inList) hitCount++; else missCount++;
				countHit.textContent = String(hitCount);
				countMiss.textContent = String(missCount);
				countExtracted.textContent = String(extractedSet.size);

				if (!inList) vibrate(120);
			}

			btnClearResult.addEventListener('click', () => {
				extractedSet.clear(); hitCount = 0; missCount = 0;
				resultBody.innerHTML = ''; countExtracted.textContent = '0'; countHit.textContent = '0'; countMiss.textContent = '0';
				ocrTime.textContent = '單次 OCR 用時：—';
			});

			btnExportCSV.addEventListener('click', () => {
				const rows = [['code', 'source', 'status']];
				Array.from(resultBody.querySelectorAll('tr')).reverse().forEach(tr => {
					const tds = tr.querySelectorAll('td');
					rows.push([tds[0].textContent, tds[1].textContent, tds[2].textContent]);
				});
				const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\r\n');
				const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a'); a.href = url; a.download = 'scan_results.csv'; a.click();
				URL.revokeObjectURL(url);
			});

			function posFromEvent(e) {
				const t = e.touches ? e.touches[0] : e;
				const r = videoWrap.getBoundingClientRect();
				return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height };
			}
			function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
			function pixelROI(vw, vh) {
				return {
					x: Math.round(roi.x * vw), y: Math.round(roi.y * vh),
					w: Math.round(roi.w * vw), h: Math.round(roi.h * vh)
				};
			}

			// 事件綁定
			['mousedown', 'touchstart'].forEach(evt => {
				roiBox.addEventListener(evt, (e) => {
					if (!scanning) return;
					e.preventDefault();
					const target = e.target;
					dragging = target.classList.contains('handle') ? target.classList[1] : 'move';
				}, { passive: false });
			});
			['mousemove', 'touchmove'].forEach(evt => {
				window.addEventListener(evt, (e) => {
					if (!dragging || !scanning) return;
					e.preventDefault();
					const p = posFromEvent(e);
					const minW = 0.08, minH = 0.08;

					if (dragging === 'move') {
						const cx = p.x - roi.w / 2, cy = p.y - roi.h / 2;
						roi.x = clamp(cx, 0, 1 - roi.w);
						roi.y = clamp(cy, 0, 1 - roi.h);
					} else {
						let x1 = roi.x, y1 = roi.y, x2 = roi.x + roi.w, y2 = roi.y + roi.h;
						if (dragging === 'nw') { x1 = p.x; y1 = p.y; }
						if (dragging === 'ne') { x2 = p.x; y1 = p.y; }
						if (dragging === 'sw') { x1 = p.x; y2 = p.y; }
						if (dragging === 'se') { x2 = p.x; y2 = p.y; }
						const nx = Math.min(x1, x2), ny = Math.min(y1, y2),
							nw = Math.abs(x2 - x1), nh = Math.abs(y2 - y1);
						roi.x = clamp(nx, 0, 1); roi.y = clamp(ny, 0, 1);
						roi.w = Math.max(minW, Math.min(nw, 1 - roi.x));
						roi.h = Math.max(minH, Math.min(nh, 1 - roi.y));
					}
					updateROIBox();
				}, { passive: false });
			});
			['mouseup', 'touchend', 'touchcancel'].forEach(evt => {
				window.addEventListener(evt, () => { dragging = null; }, { passive: true });
			});

			// 小工具
			function toast(msg, type) {
				overlayMsg.textContent = msg;
				overlayMsg.style.background =
					type === 'bad' ? 'linear-gradient(0deg,#e23b3b,#ff6b6b)' :
						type === 'ok' ? 'linear-gradient(0deg,#11a36d,#23c485)' :
							'linear-gradient(0deg,#777,#999)';
			}
			function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) { } }
			function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
		})();

		// 防晃動
		const MOTION = {
			sampleW: 64,      // 縮小後寬度
			sampleH: 36,      // 縮小後高度
			threshold: 0.08,  // 0~1，數字越大越不敏感（可試 0.06~0.08）
			minStable: 2      // 需要連續幾幀穩定才允許 OCR
		};
		let lastSmallGray = null;
		let stableFrames = 0;
		const _off = document.createElement('canvas');
		const _offCtx = _off.getContext('2d');

		/** 回傳 true = 有晃動（暫停 OCR） */
		function detectMotion(ctx, w, h) {
			_off.width = MOTION.sampleW;
			_off.height = MOTION.sampleH;

			// 縮小取樣（等於做降噪）
			_offCtx.drawImage(ctx.canvas, 0, 0, w, h, 0, 0, MOTION.sampleW, MOTION.sampleH);
			const data = _offCtx.getImageData(0, 0, MOTION.sampleW, MOTION.sampleH).data;

			// 轉灰階
			const cur = new Uint8ClampedArray(MOTION.sampleW * MOTION.sampleH);
			for (let i = 0, j = 0; i < data.length; i += 4, j++) {
				cur[j] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
			}

			// ⭐ 第一幀直接視為穩定，不顯示「晃動中」
			if (!lastSmallGray) {
				lastSmallGray = cur;
				stableFrames = 1;   // 第一幀算穩定
				return false;       // 不當作晃動
			}

			// 計算平均差（0~1）
			let diff = 0;
			for (let i = 0; i < cur.length; i++) diff += Math.abs(cur[i] - lastSmallGray[i]);
			diff /= (cur.length * 255);

			lastSmallGray = cur;

			if (diff > MOTION.threshold) { stableFrames = 0; return true; }
			stableFrames++;
			return false;
		}
	</script>
