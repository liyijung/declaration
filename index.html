<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報單系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preload" as="image" href="aviation.jpg">
    <link rel="icon" href="favicon_A.ico" type="image/x-icon">
    <style>
        body {
            background-image: url('aviation.jpg');
            background-size: cover; /* 讓圖片覆蓋整個畫面 */
            background-position: bottom; /* 圖片對齊底部並置中 */
            background-repeat: no-repeat; /* 防止圖片重複 */
            font-family: "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 確保不影響其他內容 */
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-primary {
            width: 100%;
            border-radius: 10px;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }

        .container {
            margin-top: 150px;
            flex: 1; /* 讓主內容填滿 */
            padding-bottom: 105px; /* 🟡 底部預留空間 */
        }

        .card {
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* 🛠️ 公告視窗樣式 */
        #announcement-box {
            position: fixed;
            bottom: -150px;
            left: 15px;
            background: rgba(255, 255, 255, 0.9); /* 半透明背景 */
            border: 2px solid #333;
            border-radius: 20px;
            padding: 8px;
            padding-right: 30px; /* 區塊內右側留空間 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            transition: bottom 1s ease;
            z-index: 1000;
            backdrop-filter: blur(5px); /* 模糊效果 */
        }

        #announcement {
            font-size: 40px;
        }

        #message {
            font-weight: bold;
            animation: bounce 1s infinite alternate;
            margin-top: 5px; /* 文字往下推5px */
        }

        #close-btn {
            background: #ff7f7f;
            border: none;
            padding: 5px 10px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        #close-btn:hover {
            background: #e74c3c;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        /* 📌 頁面底部區塊 */
        footer {
            background: #3b3b3b;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            margin-top: auto;
        }

        .subtle-yellow-btn {
            background-color: #ffdb71;
            color: #212529;
            border: 1px solid #ffc107;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .subtle-yellow-btn:hover {
            background-color: #f4d16a;
            border-color: #ffca2c;
            color: #212529;
        }
        
        /* 預設大螢幕 (桌機、平板) 保持比較寬鬆 */
        .custom-gap {
            row-gap: 3rem;   /* 上下間距 */
            column-gap: 2rem; /* 左右間距 */
        }

        /* 小於768px的螢幕時，自動縮小上下距離 */
        @media (max-width: 768px) {
            .custom-gap {
                row-gap: 1.5rem; /* 上下間距縮小 */
                column-gap: 1rem; /* 左右間距縮小 */
            }
        }

        /* 🛠️ 小螢幕時，整個上方間距變小 */
        @media (max-width: 768px) {
            .container {
                margin-top: 28px !important;
            }
        }

    </style>
</head>

<!-- 🚀 報單管理系統導航列 -->
<header class="bg-dark text-white py-2 px-3 d-flex justify-content-between align-items-center">
    <h2 class="m-0">📑 報單系統</h2>
    <nav class="d-flex align-items-center">
        <!-- 🔑 登入按鈕（未登入時顯示） -->
        <button id="login-btn" class="btn btn-outline-light ms-3" data-bs-toggle="modal" data-bs-target="#loginModal">
            🔑 登入
        </button>
        
        <!-- 登入後顯示帳號資訊 -->
        <div id="user-info" class="d-none d-flex align-items-center">
            <span class="me-3 text-light fw-bold" id="user-name">使用者</span>
            <button id="logout-btn" class="btn btn-outline-warning">🔓 登出</button>
        </div>
    </nav>
</header>

<body>
    <!-- 🔑 登入彈跳框 -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">🔑 登入系統</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="userid" placeholder="帳號" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" placeholder="密碼" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登入</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container text-center mt-5">
        <div class="row justify-content-center custom-gap">
            
            <!-- 出口報單製作 -->
            <div class="col-md-5">
                <div class="card border-primary h-100 shadow">
                    <div class="card-body pt-3">
                        <h3 class="card-title text-primary">✈️ 出口報單製作</h3>
                        <p class="card-text">建立出口報單，查看與編輯申報內容。</p>
                        <a id="export-link" href="#" class="btn btn-primary btn-lg w-100"
                            onclick="checkLogin(event, 'Export.html')">進入製作</a>
                    </div>
                </div>
            </div>
    
            <!-- 進口報單製作 -->
            <div class="col-md-5">
                <div class="card border-success h-100 shadow">
                    <div class="card-body pt-3">
                        <h3 class="card-title text-success">📦 進口報單製作</h3>
                        <p class="card-text">建立進口報單，查看與編輯申報內容。</p>
                        <a id="import-link" href="#" class="btn btn-success btn-lg w-100"
                            onclick="checkLogin(event, 'Import.html')">【建置中】</a>
                            <!-- 若加 disabled 可避免使用者誤點 -->
                    </div>
                </div>
            </div>

            <!-- 資料分欄工具 -->
            <div class="col-md-5">
                <div class="card border-warning bg-white h-100 shadow">
                    <div class="card-body pt-3">
                        <h3 class="card-title text-dark">📋 資料分欄</h3>
                        <p class="card-text text-dark">
                            可將貼上的資料依照指定規則分隔為多欄。
                        </p>
                        <a href="#" onclick="checkLogin(event, 'dataSplitter.html')" class="btn btn-warning btn-lg w-100">
                            開啟工具
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 🛠️ 公告區 🚀📢🚨🔔⚠️📝🔄🆕📅 -->
    <div id="announcement-box">
        <div id="announcement">📌</div>
        <div id="message">
            匯率更新：每月 1、11、21 日<br>
            稅則更新：2025/07/01<br>
        </div>
        <!-- <button id="close-btn">關閉</button> -->
    </div>

    <div id="countdown-box" style="
        font-size: 14px;
        color: #ffffff;
        text-align: right;
        margin-right: 8px;
        animation: pulse 3s infinite alternate;
    ">
    </div>

    <!-- 頁面底部資訊 -->
    <footer>
        <p style="text-align: right; margin-bottom: 0px;">版本號：v1.1.1</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./script.js"></script>

    <script>
        const refreshInterval = 600000; // 10分鐘
        let refreshTimer = null;
        let startTime = null;
    
        function startRefreshCountdown() {
            // 開始記錄起始時間
            startTime = Date.now();
            refreshTimer = setTimeout(() => {
                location.reload();
            }, refreshInterval);
        }
    
        function stopRefreshCountdown() {
            // 停止倒數
            if (refreshTimer) {
                clearTimeout(refreshTimer);
                refreshTimer = null;
            }
        }
    
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // 使用者回來頁面，重新開始倒數
                stopRefreshCountdown();
                startRefreshCountdown();
            } else {
                // 使用者離開頁面，停止倒數
                stopRefreshCountdown();
            }
        });
    
        // 一開始就啟動
        if (document.visibilityState === 'visible') {
            startRefreshCountdown();
        }
    </script>
    
</body>
</html>
